<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Total Details - Club Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="total_details.css">
</head>

<body>

    <!-- Back to Home button -->
    <a href="index.html" class="back-button">← Back to Home</a>

    <header>
        <h1>Total Details</h1>
        <p class="subtitle">Financial Overview</p>
    </header>

    <main class="container">

        <div class="boxes">

            <div class="box green">
                <h3>KUTTIPIRIV</h3>
                <p id="kuttipiriv">₹ 0</p>
            </div>

            <div class="box red">
                <h3>EXPENSES</h3>
                <p id="expenses">₹ 0</p>
            </div>

            <div class="box blue">
                <h3>PROFIT</h3>
                <p id="profit">₹ 0</p>
            </div>

        </div>

    </main>

    <script src="total_details.js"></script>
</body>
</html>
