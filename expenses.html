<!DOCTYPE html>
<html>
<head>
    <title>Expenses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="expenses.css">
</head>
<body>

    <div class="container">

        <!-- Back button -->
        <a href="index.html" class="back">← Back to Home</a>

        <h2>Expenses</h2>

        <!-- Wrap inputs in a form -->
        <form id="expenseForm">

            <!-- Details -->
            <div class="field">
                <label>Details</label>
                <input type="text" id="details" placeholder="Enter Details" autocomplete="off" />
            </div>

            <!-- Amount -->
            <div class="field hidden" id="amountBox">
                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter Amount" autocomplete="off" />
            </div>

            <!-- Save Button -->
            <div class="saveBox hidden" id="saveBox">
                <button type="submit" id="saveBtn">Save</button>
            </div>

        </form>

        <p id="status"></p>

    </div>

    <script src="expenses.js"></script>

</body>
</html>
